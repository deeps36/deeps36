<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Deep Panchal  Software Engineer</title>
  <desc id="bannerDesc">Hero banner for Deep Panchal, Software Engineer working across full-stack, cloud and GIS platforms</desc>
  <defs>
    <!-- Soft radial glow -->
    <radialGradient id="glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1a2332" stop-opacity="1"/>
      <stop offset="55%" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="100%" stop-color="#010409" stop-opacity="1"/>
    </radialGradient>

    <!-- Accent line gradient -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="35%" stop-color="#58a6ff" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#79c0ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="0.6"/>
    </pattern>

    <!-- Soft vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>

    <!-- Animated shimmer for accent bar -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0">
        <animate attributeName="offset" values="-0.3;1.3" dur="4.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55">
        <animate attributeName="offset" values="0;1.6" dur="4.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0">
        <animate attributeName="offset" values="0.3;1.9" dur="4.5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#glow)"/>
  <rect width="1200" height="420" fill="url(#grid)" opacity="0.45"/>
  <rect width="1200" height="420" fill="url(#vignette)"/>

  <!-- Floating geometric accents -->
  <g opacity="0.35">
    <circle cx="160" cy="90" r="2.5" fill="#58a6ff">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="120" r="2" fill="#79c0ff">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="320" r="1.8" fill="#58a6ff">
      <animate attributeName="opacity" values="0.15;0.6;0.15" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="340" r="2.2" fill="#8b949e">
      <animate attributeName="opacity" values="0.2;0.55;0.2" dur="5.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Thin architectural frame -->
  <rect x="48" y="36" width="1104" height="348" rx="4" fill="none" stroke="#21262d" stroke-width="1"/>
  <rect x="56" y="44" width="1088" height="332" rx="2" fill="none" stroke="#161b22" stroke-width="1"/>

  <!-- Corner marks -->
  <g stroke="#30363d" stroke-width="1.5" fill="none">
    <path d="M56 68 V44 H80"/>
    <path d="M1144 68 V44 H1120"/>
    <path d="M56 352 V376 H80"/>
    <path d="M1144 352 V376 H1120"/>
  </g>

  <!-- Eyebrow -->
  <text x="600" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="4.5" fill="#8b949e">
    SOFTWARE ENGINEER &#183; FULL-STACK &#183; CLOUD &#183; GIS
  </text>

  <!-- Name -->
  <text x="600" y="198" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="600" letter-spacing="1.5" fill="#f0f6fc">
    Deep Panchal
  </text>

  <!-- Accent divider under name -->
  <rect x="470" y="220" width="260" height="1.5" fill="url(#accent)" rx="1"/>
  <rect x="470" y="220" width="260" height="1.5" fill="url(#shimmer)" rx="1"/>

  <!-- Tagline -->
  <text x="600" y="268" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#c9d1d9">
    Engineering the future, one system at a time.
  </text>

  <!-- CTA pill -->
  <a href="https://deepstech.netlify.app/" target="_blank" rel="noopener noreferrer">
    <rect x="500" y="300" width="200" height="40" rx="20" fill="#238636" stroke="#2ea043" stroke-width="1">
      <animate attributeName="opacity" values="0.92;1;0.92" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="600" y="325" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="0.8" fill="#ffffff">
      View Portfolio &#8594;
    </text>
  </a>
</svg>
