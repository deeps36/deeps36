<svg xmlns="http://www.w3.org/2000/svg" width="900" height="24" viewBox="0 0 900 24" role="img" aria-label="Section divider">
  <defs>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0">
        <animate attributeName="offset" values="-0.4;1.2" dur="3.8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.7">
        <animate attributeName="offset" values="-0.1;1.5" dur="3.8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0">
        <animate attributeName="offset" values="0.2;1.8" dur="3.8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  <rect x="60" y="11" width="780" height="1.5" rx="1" fill="url(#line)"/>
  <rect x="60" y="11" width="780" height="1.5" rx="1" fill="url(#pulse)"/>
  <circle cx="450" cy="12" r="3" fill="#58a6ff" opacity="0.9">
    <animate attributeName="r" values="2.5;3.5;2.5" dur="3.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;1;0.55" dur="3.8s" repeatCount="indefinite"/>
  </circle>
</svg>
